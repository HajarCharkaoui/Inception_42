# تشغيل الـ daemon على IPv4
listen=YES
listen_ipv6=NO

# إبقاء السيرفر في الـ foreground باش ما يطيحش Docker
background=NO

# تفعيل الولوج للمستخدمين المحليين وحق الكتابة
local_enable=YES
write_enable=YES

# إعدادات الـ Passive Mode (ضرورية لـ Docker)
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21005
pasv_address=127.0.0.1