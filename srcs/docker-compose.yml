services:
  mariadb:
  # How do i create the MariaDB image ? so i use the Dockerfile located in ./requirements/mariadb
    container_name: mariadb
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
  # Give the image name
    image: mariadb
  # Configure the contnainer
    restart: on-failure
  # Add environement variables
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
  # Create a volume where we can store data
    volumes:
      - db_data:/var/lib/mysql
  # Declare the internal port for this service
    # expose: 
    #   - "3306"
  # Put MariaDB on a network , so it can communicate with other services 
    networks:
      - inception_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -p$$(cat /run/secrets/db_root_password)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
 
  
  wordpress:
    container_name: wordpresss
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wp_data:/var/www/html
    expose: 
      - "9000"
    networks:
      - inception_network
    
  nginx:
    container_name: nginx
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    depends_on:
      - wordpress
    restart: on-failure
    env_file:
      - .env
    volumes:
      - wp_data:/var/www/html
    ports: 
      - "443:443"
    networks:
      - inception_network
# bonus services:
  redis:
    container_name: redis
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    image: redis
    restart: on-failure
    # expose:
    #   - "6379"
    networks:
      - inception_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  
  ftp:
    container_name:  ftp
    build:
      context: ./requirements/bonus/ftp
      dockerfile: Dockerfile
    image: ftp
    restart: on-failure
    env_file:
      - .env
    secrets:
      - ftp_user_password
    ports:
      - "21:21"
      - "21000-21005:21000-21005"
    volumes  :
      - wp_data:/var/www/html
    networks:
      - inception_network
  adminer:    
    container_name: adminer
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    image: adminer
    restart: on-failure
    depends_on:
      - mariadb
    ports:
      - "8080:8080"
    networks:
      - inception_network
  website:
    build: requirements/bonus/website
    container_name: website
    restart: on-failure
    networks:
      - inception_network
    # expose:
    #   - "3000"


networks:
  inception_network:
    driver: bridge

volumes:
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hacharka/data/wordpress
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hacharka/data/mariadb
secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt
  wp_admin_password:
    file: ./secrets/wp_admin_password.txt
  wp_user_password:
    file: ./secrets/wp_user_password.txt
  ftp_user_password:
    file: ./secrets/ftp_user_password.txt
  credentials:
    file: ./secrets/credentials.txt